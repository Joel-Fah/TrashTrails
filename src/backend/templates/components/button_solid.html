{% comment %}
Solid/Filled Button Component
Usage: {% include 'components/button_solid.html' with href='/your-url/' text='Button Text' %}
Optional: class (extra classes), target (link target)
{% endcomment %}

<a
        href="{{ href|default:'#' }}"
        {% if target %}target="{{ target }}"{% endif %}
        class="inline-flex items-center justify-center px-8 py-4 rounded-3xl border
        bg-primary text-white font-medium transition-all duration-300 ease-in-out
        hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-200
        focus:ring-offset-2 {{ class|default:'' }}"
>
    {{ text|default:'Get Started' }}
</a>
